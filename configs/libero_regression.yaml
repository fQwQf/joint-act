model:
  backbone: openvla
  pretrained: openvla/openvla-7b
  revision: 47a0ec7fc4ec123775a391911046cf33cf9ed83f
  head_dim: 512
  horizon: 8
  num_modes: 64
  num_images: 2
  lora_rank: 16
  lora_alpha: 32
  freeze_vision: true
  freeze_projector: true
  gradient_checkpointing: true
  head_type: regression
data:
  root: data/libero
  artifacts: data/libero/artifacts
  image_aug: true
  crop_scale: 0.9
  workers: 0
train:
  output: runs/libero_regression
  device: cuda:0
  precision: bf16
  batch_size: 1
  grad_accumulation: 16
  max_steps: 20000
  learning_rate: 0.0002
  warmup_steps: 500
  save_every: 1000
  eval_every: 500
  eval_batches: 100
  keep_checkpoints: 3
  min_free_disk_gb: 5.0
