[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "joint-act"
version = "0.1.0"
description = "Direct joint action decisions with pretrained vision-language-action backbones"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["torch>=2.2", "numpy>=1.24,<2", "Pillow>=10", "h5py>=3.10", "PyYAML>=6"]

[project.optional-dependencies]
openvla = ["transformers==4.40.1", "tokenizers==0.19.1", "timm==0.9.10", "peft==0.11.1", "accelerate>=0.30,<1", "sentencepiece>=0.1.99", "huggingface-hub>=0.23,<1"]
data = ["tensorflow-cpu==2.15.1", "tensorflow-datasets==4.9.3", "tensorflow-metadata==1.15.0", "protobuf>=3.20.3,<5", "numpy<2", "huggingface-hub>=0.23,<1"]
serve = ["fastapi>=0.110", "uvicorn>=0.29"]
video = ["imageio[ffmpeg]>=2.34"]
dev = ["pytest>=8", "ruff>=0.6", "build>=1", "httpx>=0.27"]

[project.scripts]
jointact = "jointact.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: exercises optional external packages", "gpu: requires a free CUDA GPU"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
